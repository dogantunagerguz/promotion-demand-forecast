name: Gurobi junior optimization check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run illustrative allocation model
        run: >-
          python optimization/allocate_with_gurobi.py
          --capacity-ratio 0.90
          --output /tmp/gurobi_allocation.csv
